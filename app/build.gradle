plugins {
    id 'com.android.application'
}

android {
    namespace 'com.abel.hyperosglass'
    compileSdk 37
    buildToolsVersion '37.0.0'

    defaultConfig {
        applicationId 'com.abel.hyperosglass'
        minSdk 33
        targetSdk 34
        versionCode 1
        versionName '1.0'
    }

    buildTypes {
        release {
            minifyEnabled false
        }
        debug {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Xposed API 仅编译期需要，运行时由 LSPosed 提供。
    // 已内置到 app/libs/XposedBridgeApi-82.jar（来自 https://api.xposed.info ），无需联网。
    compileOnly files('libs/XposedBridgeApi-82.jar')
}
