pluginManagement {
    repositories {
        google()
        mavenCentral()
        gradlePluginPortal()
    }
}

dependencyResolutionManagement {
    repositoriesMode.set(RepositoriesMode.FAIL_ON_PROJECT_REPOS)
    repositories {
        google()
        mavenCentral()
        // Xposed API 不在 Maven Central，由官方仓库提供
        maven { url 'https://api.xposed.info/' }
    }
}

rootProject.name = 'HyperOSGlassModule'
include ':app'
